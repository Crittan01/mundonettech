# Dependabot — actualizaciones semanales agrupadas y parches de seguridad en develop.
# Los majors automáticos se ignoran para evitar rupturas sin evaluación previa;
# las alertas y actualizaciones de seguridad siguen habilitadas siempre.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
